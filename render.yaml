services:
  - type: web
    name: aad-lapp-course-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: drain-adoption
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/drains
    autoDeployTrigger: "off"
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55.0"
      - key: RENDER_DATABASE_CONNECTION
        fromDatabase:
          name: aad-lapp-course-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REPORT_PHOTOS_ENABLED
        value: "true"
      - key: SEED_DEMO
        value: "false"
  - type: web
    name: aad-lapp-course
    runtime: static
    rootDir: drain-adoption-frontend
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 run build
    staticPublishPath: ./build
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
      - key: REACT_APP_COURSE_PILOT
        value: "true"
      - key: REACT_APP_API_URL
        sync: false
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: aad-lapp-course-db
    plan: free
    region: frankfurt
    databaseName: aad_pilot
    user: aad_pilot
    postgresMajorVersion: "17"
    ipAllowList: []
