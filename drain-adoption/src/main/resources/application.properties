server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/aad2}
spring.datasource.username=${DATABASE_USERNAME:aad2}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
aad.upload-directory=${UPLOAD_DIRECTORY:./data/photos}
aad.report-photos-enabled=${REPORT_PHOTOS_ENABLED:true}
aad.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
aad.seed-demo=${SEED_DEMO:true}
aad.bootstrap-admin-email=${ADMIN_EMAIL:}
aad.bootstrap-admin-password=${ADMIN_PASSWORD:}
